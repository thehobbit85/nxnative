# Tests that need no game files, keys or GPU. GitHub's macOS runners are virtual Macs without Metal 4 (issue #112), so the tests that go through mtl_init
# (t_nvn, t_mip_extent, t_rt_range and the rest of dm/gfx/tests' run list) stay local: run `make -C dm/gfx/tests GAME=<id> run` on an Apple-silicon Mac.
# `profile_guess.py --check` stays local too: it compares the guesses with the extractions of the games (it needs their files).
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request replaces its older run. A push to main never cancels: main's pushes come faster than a run gets runners and finishes, so cancelling left main
# with no finished run for 87 commits. The running one finishes and only the newest push waits behind it (GitHub replaces an older waiting run).
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The toolchain the project supports (README: Xcode 27.2; dm/gfx/tools/dmsh_chain.lock: its Metal compiler), on GitHub's xcode-27 image (macOS 27, a preview image),
  # named by path so the image's default moving to another Xcode does not move CI. The build check checks the Metal compiler against the lock first.
  # dm/tools/tests/test_ci_toolchain.py keeps this version, the image and README's in step
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
  GAME: 010015100B514000   # Super Mario Bros. Wonder: the profile the host and gfx tests are built for (any profile does; the tests are about code, not the game)

defaults:
  run:
    shell: bash

# Actions are pinned to commit SHAs (the tag in the comment): a tag can be moved, a SHA cannot. Dependabot (github-actions) can raise them.
jobs:
  vulkan-replay:
    name: NVN Vulkan replay (Mesa software driver)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Draw and verify pixels with full and compact NVN records
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libvulkan-dev mesa-vulkan-drivers glslc
          drivers=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${drivers[0]}"
          VK_DRIVER_FILES="${drivers[0]}" make -C dm/gfx/nvn/vulkan GAME="$GAME" CC=clang replay-test portable-capture-test

  android-gates:
    name: Android ARM64 service gates (emulated)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Build with the NDK and execute the rewritten module with static bionic
        run: |
          python -m pip install lz4 'capstone>=5,<6'
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-user
          bin="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$bin/aarch64-linux-android30-clang" -fPIC -c dm/host/entry.S -o "$RUNNER_TEMP/gates.o"
          "$bin/ld.lld" -shared -z text -z noexecstack "$RUNNER_TEMP/gates.o" -o "$RUNNER_TEMP/gates.so"
          make -C dm/host/tests GAME="$GAME" GATE_ABI=android GATE_SEGMENT_ALIGN=4096 \
            GATE_CC="$bin/aarch64-linux-android30-clang -static -ffunction-sections -fdata-sections -Wl,--gc-sections" GATE_RUNNER=qemu-aarch64 gate-test
          # Android command-line programs use the system dynamic linker. Cross-link
          # that configuration in addition to the static bionic run above.
          make -C dm/host/tests GAME="$GAME" GATE_ABI=android GATE_SEGMENT_ALIGN=4096 B=build-dynamic \
            GATE_CC="$bin/aarch64-linux-android30-clang -fPIE -pie -fvisibility=hidden -Wl,-z,text,-z,noexecstack,-z,max-page-size=16384" gate-build
          make -C dm/host/tests GAME="$GAME" CLANG="$bin/aarch64-linux-android30-clang -static -D_GNU_SOURCE" build/t_time
          qemu-aarch64 dm/host/tests/build/t_time
          make -C dm/host/tests GAME="$GAME" CLANG="$bin/aarch64-linux-android30-clang -static -Wl,--gc-sections" build/t_bigstack
          qemu-aarch64 dm/host/tests/build/t_bigstack
          make -C dm/host/tests GAME="$GAME" CLANG="$bin/aarch64-linux-android30-clang -static" android-memory-build
          make -C dm/host/tests GAME="$GAME" CLANG="$bin/aarch64-linux-android30-clang -static -D_GNU_SOURCE" build/t_fault_access build/t_lifecycle build/t_hid build/t_android_scheduler
          make -C dm/host/tests GAME="$GAME" CLANG="$bin/aarch64-linux-android30-clang -static -D_GNU_SOURCE -ldl" build/t_fpslock build/t_uecvar build/t_ue_heap_span
          make -C dm/host/tests GAME="$GAME" LANGUAGE_SAN= CLANG="$bin/aarch64-linux-android30-clang -static -D_GNU_SOURCE -ldl" build/t_language build/t_nfc build/t_shared_font build/t_fdstat
          make -C dm/host/tests GAME="$GAME" CLANG="$bin/aarch64-linux-android30-clang -static -D_GNU_SOURCE -Wno-error=format -ldl" build/t_system_event
          make -C dm/host/tests GAME="$GAME" CLANG="$bin/aarch64-linux-android30-clang" build/t_audio_android
          make -C dm/host/tests GAME="$GAME" CLANG="$bin/aarch64-linux-android30-clang -static" android-fs-build
          make -C dm/host/tests GAME="$GAME" CLANG="$bin/aarch64-linux-android30-clang" build/t_android_avc
          make -C dm/host/tests -j4 GAME="$GAME" CLANG="$bin/aarch64-linux-android30-clang -static" \
            CODEC_AR="$bin/llvm-ar" android-software-video
          make -C dm/gfx/nvn/vulkan GAME="$GAME" CC="$bin/aarch64-linux-android30-clang" \
            GLSLC="$ANDROID_NDK_HOME/shader-tools/linux-x86_64/glslc" LIBS="-lvulkan -landroid -lm" fixture android-recorder build/t_capture

      - name: Build the cheat VM and executable-text test with static bionic
        run: |
          cc="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"
          make -C dm/host/tests GAME="$GAME" CLANG="$cc -static -D_GNU_SOURCE" build/t_cheats
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-kernel-tests
          path: |
            dm/host/tests/build/t_cheats
            dm/host/tests/build/t_memory_android*
            dm/host/tests/build/t_fault_access
            dm/host/tests/build/t_lifecycle
            dm/host/tests/build/t_software_video
            dm/host/tests/build/t_hid
            dm/host/tests/build/t_fpslock
            dm/host/tests/build/t_uecvar
            dm/host/tests/build/t_ue_heap_span
            dm/host/tests/build/t_fdstat
            dm/host/tests/build/t_language
            dm/host/tests/build/t_nfc
            dm/host/tests/build/t_shared_font
            dm/host/tests/build/t_system_event
            dm/host/tests/build/t_android_scheduler
            dm/host/tests/build/android-fs/t_*
          retention-days: 1

  android-memory:
    name: Android bionic memory and signals (native ARM64 Linux kernel)
    needs: android-gates
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: android-kernel-tests
          path: tests
      - name: Check native pages, stacks, self-process reads, faults and graceful shutdown
        run: |
          chmod +x tests/t_memory_android tests/t_memory_android_unlimited tests/t_fault_access tests/t_lifecycle
          tests/t_fault_access
          tests/t_lifecycle
          chmod +x tests/t_cheats
          TMPDIR="$RUNNER_TEMP" tests/t_cheats
          tests/t_memory_android
          tests/t_memory_android_unlimited
      - name: Check frame settings and engine heap alignment on bionic
        run: |
          for test in t_fpslock t_uecvar t_ue_heap_span; do
            chmod +x "tests/$test"
            "tests/$test"
          done
      - name: Check SDK language, fonts, NFC and vsync event lifetime on bionic
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          for test in t_language t_nfc t_shared_font t_system_event t_fdstat; do
            chmod +x "tests/$test"
            "tests/$test"
          done
      - name: Check guest HID state, scripted input and haptic routing
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          chmod +x tests/t_hid
          tests/t_hid
      - name: Decode synthetic VP8, VP9 and AV1 packets with static bionic
        run: |
          chmod +x tests/t_software_video
          tests/t_software_video
      - name: Run guest threads, priority handoffs, waits and signal contexts on bionic
        run: |
          chmod +x tests/t_android_scheduler
          tests/t_android_scheduler
          DM_PREEMPT=1 tests/t_android_scheduler
      - name: Check filesystem transactions, rollback and save bundles
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          chmod +x tests/android-fs/t_*
          tests/android-fs/t_fs
          tests/android-fs/t_fs_commit_list
          tests/android-fs/t_save_sync

  host-tests:
    name: Host unit tests and CPU-only gfx tests
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Host unit tests (dm/host/tests)
        run: |
          mkdir -p logs
          make -C dm/host/tests GAME="$GAME" -j3 run 2>&1 | tee logs/host-tests.log
      - name: ThreadSanitizer (audio, HID and guest memory)
        run: |
          make -C dm/host/tests GAME="$GAME" -j3 tsan memory-tsan 2>&1 | tee logs/tsan.log
      - name: Thermal cap and ThreadSanitizer (concurrent frame-cap readers)
        run: |
          make -C dm/gfx/tests GAME="$GAME" -j3 check_t_thermal thermal-tsan 2>&1 | tee logs/thermal.log
      - name: CPU texture layout and deswizzle tests
        run: |
          make -C dm/gfx/tex/tests t_tex 2>&1 | tee logs/texture-build.log
          dm/gfx/tex/tests/t_tex 2>&1 | tee logs/texture-tests.log
      - name: CPU-only gfx tests (dm/gfx/tests)
        run: |
          mkdir -p logs
          cd dm/gfx/tests
          make GAME="$GAME" -j3 t_perf_order
          ./t_perf_order --cpu 2>&1 | tee ../../../logs/t_perf_order.log
          make GAME="$GAME" -j3 perf-order-tsan 2>&1 | tee ../../../logs/t_perf_order-tsan.log
          tests="t_gfx_suspend t_capture t_dirty_slots t_dirty_race t_dirty_retire_race t_tex_layout t_pace t_fstep t_link_ticks t_cpu_tex t_hmap t_cover t_pso_skey t_refl t_rt_range_ro t_present_rescue t_gpuprof t_sparse_layout t_timestamp t_rt_depth_ro t_rt_range_shape t_ub t_pso_pending t_vk_desc t_rec_draws"
          make GAME="$GAME" -j3 $tests 2>&1 | tee ../../../logs/gfx-build.log
          failed=0
          for t in $tests; do
            echo "::group::$t"
            ./$t 2>&1 | tee "../../../logs/$t.log" && rc=0 || rc=1   # pipefail: the test's status
            echo "::endgroup::"
            if [ "$rc" != 0 ]; then echo "::error::$t failed"; failed=1; fi
          done
          exit $failed
      - name: Direct OpenGL imports and EGL lookup (no GPU)
        run: make -C dm/gfx/tests GAME="$GAME" gl-imports 2>&1 | tee logs/gl-imports.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-host-tests
          path: logs
          retention-days: 7

  # Documented fixture/framework exceptions live in dm/sanitizers; new host findings fail the job and are fixed.
  # A job of its own, so its time shows beside the plain tests'.
  sanitizers:
    name: Sanitizers (ASan, UBSan and TSan over the host and CPU texture tests)
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ASan and UBSan, every host unit test (dm/host/tests)
        run: |
          mkdir -p logs
          make -C dm/host/tests GAME="$GAME" -j3 asan 2>&1 | tee logs/host-asan.log
      - name: ASan and UBSan, CPU texture layout and deswizzle test (dm/gfx/tex/tests)
        run: make -C dm/gfx/tex/tests asan 2>&1 | tee logs/texture-asan.log
      - name: ThreadSanitizer, the host tests that start threads (dm/host/tests)
        run: make -C dm/host/tests GAME="$GAME" -j3 tsan-threads 2>&1 | tee logs/host-tsan-threads.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-sanitizers
          path: logs
          retention-days: 7

  # Line coverage of the host and CPU texture tests (llvm-cov) and of the tool tests (coverage.py), as a job summary: totals per area, the largest files and, on a pull
  # request, which of its changed lines the tests run. Report only: no coverage threshold fails it, and a failing test is the other jobs' to report (the runs here keep going,
  # so the other tests' coverage is kept). The raw reports are uploaded on every run.
  coverage:
    name: Coverage (host, CPU texture and tool tests; report only)
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2   # a pull request checks out its merge commit: HEAD^1 is the base branch it merges onto, the diff coverage's base
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/requirements/coverage.txt
      - name: Install coverage.py and the packages the tools import
        run: python -m pip install -r .github/requirements/coverage.txt
      - name: Host unit tests (dm/host/tests), llvm-cov
        continue-on-error: true
        run: |
          mkdir -p coverage
          make -C dm/host/tests GAME="$GAME" -j3 coverage 2>&1 | tee coverage/host.log
          cp dm/host/tests/build/cov/coverage.lcov coverage/host.lcov
      - name: CPU texture layout and deswizzle test (dm/gfx/tex/tests), llvm-cov
        continue-on-error: true
        run: |
          mkdir -p coverage
          make -C dm/gfx/tex/tests coverage 2>&1 | tee coverage/textures.log
          cp dm/gfx/tex/tests/cov/coverage.lcov coverage/textures.lcov
      - name: Tool tests (dm/tools/tests), coverage.py
        continue-on-error: true
        env:
          DM_GAME: ${{ env.GAME }}
        run: |
          mkdir -p coverage
          for f in dm/tools/tests/test_*.py; do
            echo "::group::$f"
            python -m coverage run -m unittest "$f" 2>&1 | tee -a coverage/python.log || echo "::warning::$f failed (the tool-test job reports it)"
            echo "::endgroup::"
          done
          python -m coverage combine -q
          python -m coverage json -q -o coverage/python.json
      - name: Summary (diff coverage against the pull request's base)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          for f in coverage/host.lcov coverage/textures.lcov coverage/python.json; do [ -f "$f" ] && a=${f#coverage/} && args+=("--${a%.*}" "$f"); done
          if [ "$EVENT" = pull_request ]; then args+=(--base HEAD^1); fi
          python dm/tools/coverage_report.py "${args[@]}" | tee coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  tool-tests:
    name: Tool tests
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the selected Xcode's Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain   # a separate component, not included in the xcode-27 image
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/workflows/tests.yml   # no requirements file: the packages are listed in the step below
      - name: Install the Python packages the tools import
        run: python -m pip install lz4 "capstone>=5,<6" fonttools   # backports.zstd is for Python before 3.14 only
      - name: Execute the rewritten guest callback and service gate on Apple Silicon
        run: make -C dm/host/tests GAME="$GAME" PYTHON=python gate-test
      # The shader translator's tests (test_image_atomic_bounds, test_dmsh_geometry) run the committed translator on synthetic Maxwell shaders, then spirv-val and the committed spirv-cross:
      # one translation chain serves every game, so these are what checks a translator change on games its author does not own (GitHub issue #272). Compiling their MSL with
      # Metal (DMSH_TEST_METAL=1) and running it on the GPU (DMSH_TEST_GPU=1) stay local.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'   # dm/gfx/tools/dmsh_xlate_bin targets net10.0
      - name: Install spirv-val   # spirv-cross is the in-repo build (dm/gfx/tools/spirv_cross_bin)
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install spirv-tools
      - name: Run the test files
        env:
          DM_GAME: ${{ env.GAME }}   # test_tbdr_budget runs a tool that needs a profile
          DMSH_TEST_XLATE: ${{ github.workspace }}/dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate
        run: |
          mkdir -p logs
          failed=0
          for f in dm/tools/tests/test_*.py dm/ios/tests/test_*.py dm/gfx/tests/test_*.py; do
            echo "::group::$f"
            python -m unittest -v "$f" 2>&1 | tee "logs/$(basename "$f").log" || { echo "::error::$f failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-tool-tests
          path: logs
          retention-days: 7

  build:
    name: Build check (Mac host, gfx tests, iOS sources)
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the selected Xcode's Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain
      - name: Toolchain (Xcode and the Metal compiler of dmsh_chain.lock)
        run: |
          xcodebuild -version
          xcrun metal --version
          python3 dm/gfx/tools/own_compilers.py --check-metal
      - name: Mac host for three profiles (Vulkan, NVN, OpenGL)
        run: |
          mkdir -p logs
          # Wonder: NVN; Hades: Vulkan; Digimon Story Cyber Sleuth: OpenGL. The second and third reuse the libvpx build in dm/host/gen/vpx.
          for g in 010015100B514000 0100535012974000 010014E00DB56000; do
            echo "::group::dmhost $g"
            make -C dm/host GAME=$g -j3 dmhost 2>&1 | tee "logs/dmhost-$g.log"
            test -x dm/host/dmhost
            echo "::endgroup::"
          done
      - name: Every gfx test compiled, not run
        run: |
          mkdir -p logs
          cd dm/gfx/tests
          tests=$(sed -n 's/^\(t_[a-z0-9_]*\):.*/\1/p' Makefile | sort -u)
          echo "$tests" | tr '\n' ' '; echo
          make GAME="$GAME" -j3 $tests 2>&1 | tee ../../../logs/gfx-tests-build.log
      - name: iOS host sources compiled for the iPhone SDK (no signing, no Xcode project)
        run: python3 dm/ios/tools/compile_check.py 2>&1 | tee logs/ios-compile.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-build
          path: logs
          retention-days: 7

  ios-build:
    name: Unsigned iOS app (synthetic modules, Swift and link)
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Build the production iOS project with synthetic inputs
        run: |
          mkdir -p logs
          python3 dm/ios/tools/build_smoke.py --output "$RUNNER_TEMP/ios-smoke" 2>&1 | tee logs/ios-build.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: logs-ios-build
          path: logs
          retention-days: 7
